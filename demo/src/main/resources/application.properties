spring.application.name=stagemgmt
server.port=${SERVER_PORT:8081}

# ---- Database ----
# Option 1: MySQL via XAMPP (currently active)
# spring.datasource.url=jdbc:mysql://localhost:3306/internbridge?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=

# Option 2: Oracle Database 23ai Free (Docker) - Uncomment to use
spring.datasource.url=jdbc:oracle:thin:@oracle-free:1521/FREE
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=SYSTEM
spring.datasource.password=YourStrongPassword123
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Option 3: H2 embedded database (zero setup) - Uncomment to use
# spring.datasource.url=jdbc:h2:file:./data/stagemgmt;AUTO_SERVER=TRUE
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false

# ---- Photo de profil ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Seed demo accounts on first run (set to false once you have real data)
app.seed-demo-data=true

# ---- Assistant IA (chatbot) ----
# Groq a un vrai palier gratuit permanent (pas juste un essai) - créez une clé sur
# https://console.groq.com (aucune carte bancaire requise) puis définissez-la comme
# variable d'environnement GROQ_API_KEY (ne collez jamais une clé directement ici si ce
# fichier part sur GitHub). Le chatbot reste désactivé tant qu'aucune clé n'est fournie -
# le reste de l'appli fonctionne normalement sans.
app.chatbot.api-key=${GROQ_API_KEY:}
app.chatbot.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# ---- Active Directory (optionnel) ----
# Désactivé par défaut : l'appli utilise les comptes locaux (table utilisateurs).
# Passez app.ad.enabled=true + renseignez domaine/URL pour authentifier via l'AD de
# la banque à la place (les comptes locaux ne pourront alors plus se connecter).
app.ad.enabled=${AD_ENABLED:false}
app.ad.domain=${AD_DOMAIN:banque.local}
app.ad.url=${AD_URL:ldap://localhost:389}

logging.level.com.example.stagemgmt=DEBUG

# Allow actuator endpoints without authentication
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.export.prometheus.enabled=true
management.endpoint.prometheus.enabled=true
management.security.enabled=false
