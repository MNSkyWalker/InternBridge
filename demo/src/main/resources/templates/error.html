<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Erreur — InternBridge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/favicon-32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/images/favicon-16.png}">
  <link rel="apple-touch-icon" th:href="@{/images/apple-touch-icon.png}">
</head>
<body class="bg-light">
<div class="container py-5 text-center">
  <h2>⚠️ Une erreur est survenue</h2>
  <p class="text-muted" th:text="${message} ?: ${error} ?: 'Erreur inconnue'">Message d'erreur</p>
  <a href="/" class="btn btn-login">Retour à l'accueil</a>
</div>
</body>
</html>
