<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activer la 2FA — InternBridge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/favicon-32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/images/favicon-16.png}">
  <link rel="apple-touch-icon" th:href="@{/images/apple-touch-icon.png}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
  <a th:href="@{/profile}" class="small text-muted"><i class="fas fa-arrow-left"></i> Retour au profil</a>

  <div class="row justify-content-center mt-3">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body p-4 text-center">
          <h5 class="mb-1">Scannez ce QR code</h5>
          <p class="text-muted small">Avec Google Authenticator, Microsoft Authenticator, ou toute appli TOTP.</p>

          <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

          <div class="qr-frame my-3">
            <img th:src="${qrCode}" alt="QR code 2FA" style="width:220px; height:220px;">
          </div>

          <p class="small text-muted">
            Impossible de scanner ? Entrez ce code manuellement dans votre appli :<br>
            <code th:text="${utilisateur.twoFactorSecret}">SECRET</code>
          </p>

          <form th:action="@{/profile/2fa/confirmer}" method="post" class="mt-3">
            <label class="form-label small">Entrez le code à 6 chiffres généré par l'appli</label>
            <input type="text" name="code" class="form-control text-center mb-3" style="max-width:180px; margin:0 auto; letter-spacing:.3em;"
                   maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autofocus required>
            <button type="submit" class="btn btn-login">Confirmer et activer</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
