<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytique — InternBridge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/favicon-32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/images/favicon-16.png}">
  <link rel="apple-touch-icon" th:href="@{/images/apple-touch-icon.png}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
  <div class="page-header">
    <h1>Analytique</h1>
    <p>Vue d'ensemble de vos stagiaires.</p>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="stat-card bg-navy">
        <div class="stat-icon"><i class="fas fa-users"></i></div>
        <div class="stat-label">Stagiaires</div>
        <div class="stat-value" th:text="${#lists.size(stagiaires)}">0</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="stat-card bg-teal">
        <div class="stat-icon"><i class="fas fa-star"></i></div>
        <div class="stat-label">Note moyenne</div>
        <div class="stat-value" th:text="${moyenneNotes} + '/20'">0/20</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="stat-card" style="background:linear-gradient(135deg,#374151,#1F2937);">
        <div class="stat-icon"><i class="fas fa-clipboard-check"></i></div>
        <div class="stat-label">Évaluations rédigées</div>
        <div class="stat-value" th:text="${nombreEvaluations}">0</div>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h6 class="mb-3">Répartition par étape</h6>
          <canvas id="chartStatut" height="220"></canvas>
        </div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h6 class="mb-3">Répartition par cycle</h6>
          <canvas id="chartCycle" height="220"></canvas>
        </div>
      </div>
    </div>
    <div class="col-12">
      <div class="card shadow-sm">
        <div class="card-body">
          <h6 class="mb-3">Avancement par stagiaire</h6>
          <canvas id="chartAvancement" height="100"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
  const statutLabels = /*[[${repartitionStatut.keySet()}]]*/ [];
  const statutData = /*[[${repartitionStatut.values()}]]*/ [];
  const cycleLabels = /*[[${repartitionCycle.keySet()}]]*/ [];
  const cycleData = /*[[${repartitionCycle.values()}]]*/ [];
  const noms = /*[[${noms}]]*/ [];
  const avancements = /*[[${avancements}]]*/ [];

  const palette = ['#0A2463', '#00BFA5', '#D97706', '#16A34A', '#DC2626', '#6B7280'];

  new Chart(document.getElementById('chartStatut'), {
    type: 'doughnut',
    data: { labels: statutLabels, datasets: [{ data: statutData, backgroundColor: palette }] },
    options: { plugins: { legend: { position: 'bottom' } } }
  });

  new Chart(document.getElementById('chartCycle'), {
    type: 'pie',
    data: { labels: cycleLabels, datasets: [{ data: cycleData, backgroundColor: palette }] },
    options: { plugins: { legend: { position: 'bottom' } } }
  });

  new Chart(document.getElementById('chartAvancement'), {
    type: 'bar',
    data: { labels: noms, datasets: [{ label: 'Avancement (%)', data: avancements, backgroundColor: '#00BFA5' }] },
    options: { scales: { y: { beginAtZero: true, max: 100 } }, plugins: { legend: { display: false } } }
  });
</script>
</body>
</html>
