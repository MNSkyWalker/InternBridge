<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vérification en 2 étapes — InternBridge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/favicon-32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/images/favicon-16.png}">
  <link rel="apple-touch-icon" th:href="@{/images/apple-touch-icon.png}">
</head>
<body class="login-shell">
  <div class="login-card">
    <div class="login-brand">
      <i class="fas fa-shield-halved brand-icon"></i>
      <h3>Vérification en 2 étapes</h3>
      <p>Ouvrez votre appli d'authentification et entrez le code affiché.</p>
    </div>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/2fa/verify}" method="post">
      <div class="mb-3">
        <input type="text" name="code" class="form-control text-center" style="letter-spacing:.3em; font-size:20px;"
               maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autofocus required>
      </div>
      <button type="submit" class="btn btn-login w-100">Vérifier</button>
    </form>

    <form th:action="@{/logout}" method="post" class="mt-3 text-center">
      <button type="submit" class="btn btn-link btn-sm text-muted">Annuler et se déconnecter</button>
    </form>
  </div>
</body>
</html>
