<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal d'activité — InternBridge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/favicon-32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/images/favicon-16.png}">
  <link rel="apple-touch-icon" th:href="@{/images/apple-touch-icon.png}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
  <div class="page-header">
    <h1>Journal d'activité</h1>
    <p>Historique des actions récentes (100 dernières entrées).</p>
  </div>

  <div class="panel-list">
    <div class="journal-entry" th:each="e : ${entrees}">
      <div class="journal-icon"><i class="fas fa-circle-check"></i></div>
      <div class="flex-grow-1">
        <div class="journal-desc">
          <strong th:text="${e.acteur.nomComplet}">Acteur</strong>
          <span th:text="${e.description}">a fait quelque chose</span>
        </div>
        <div class="journal-meta">
          <span th:text="${#temporals.format(e.dateHeure, 'dd/MM/yyyy à HH:mm')}">01/01/2026 à 10:00</span>
          <span th:if="${e.stagiaire != null}"> &middot; <span th:text="${e.stagiaire.titreSujet}">Sujet</span></span>
        </div>
      </div>
    </div>

    <div class="text-muted text-center py-5" th:if="${#lists.isEmpty(entrees)}">
      <i class="fas fa-inbox fa-2x mb-2"></i>
      <p>Aucune activité pour le moment.</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
