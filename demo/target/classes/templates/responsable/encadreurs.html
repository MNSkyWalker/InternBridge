<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encadreurs — InternBridge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/favicon-32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/images/favicon-16.png}">
  <link rel="apple-touch-icon" th:href="@{/images/apple-touch-icon.png}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
  <a th:href="@{/responsable/dashboard}" class="small text-muted"><i class="fas fa-arrow-left"></i> Retour à mes stagiaires</a>

  <div class="page-header">
    <h1>Encadreurs</h1>
    <p>Créez des comptes pour les superviseurs bancaires qui suivent vos stagiaires au quotidien.</p>
  </div>

  <div class="alert alert-success alert-dismissible fade show" th:if="${success}" th:text="${success}">
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div class="alert alert-danger alert-dismissible fade show" th:if="${error}" th:text="${error}">
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="row g-4">
    <div class="col-lg-7">
      <h6 class="section-title mb-3"><i class="fas fa-user-tie me-2"></i>Comptes existants
        <span class="badge bg-light text-dark ms-1" th:text="${#lists.size(encadreurs)}">0</span>
      </h6>

      <div class="panel-list" th:if="${not #lists.isEmpty(encadreurs)}">
        <div class="journal-entry" th:each="e : ${encadreurs}">
          <div class="journal-icon"><i class="fas fa-user-tie"></i></div>
          <div class="flex-grow-1">
            <div class="journal-desc" th:text="${e.nomComplet}">Nom</div>
            <div class="journal-meta">
              <span th:text="'@' + ${e.username}">@username</span> &middot; <span th:text="${e.email}">email</span>
            </div>
          </div>
        </div>
      </div>
      <div class="empty-state" th:if="${#lists.isEmpty(encadreurs)}">
        <i class="fas fa-user-tie"></i>
        <p class="mb-0">Aucun encadreur pour le moment.</p>
      </div>
    </div>

    <div class="col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h6 class="section-title mb-3"><i class="fas fa-circle-plus me-2"></i>Créer un compte encadreur</h6>
          <form th:action="@{/responsable/encadreurs}" method="post">
            <div class="mb-2">
              <label class="form-label small text-muted mb-1">Nom complet</label>
              <input type="text" name="nomComplet" class="form-control form-control-sm" required>
            </div>
            <div class="mb-2">
              <label class="form-label small text-muted mb-1">Nom d'utilisateur</label>
              <input type="text" name="username" class="form-control form-control-sm" required>
            </div>
            <div class="mb-2">
              <label class="form-label small text-muted mb-1">Email</label>
              <input type="email" name="email" class="form-control form-control-sm" required>
            </div>
            <div class="mb-3">
              <label class="form-label small text-muted mb-1">Mot de passe</label>
              <input type="password" name="password" class="form-control form-control-sm" required minlength="8">
            </div>
            <button type="submit" class="btn btn-sm btn-login">Créer le compte</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
