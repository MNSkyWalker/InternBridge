<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réunions — InternBridge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/favicon-32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/images/favicon-16.png}">
  <link rel="apple-touch-icon" th:href="@{/images/apple-touch-icon.png}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
  <div class="alert alert-success alert-dismissible fade show" th:if="${success}" th:text="${success}">
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 page-header">
    <div>
      <h1>Réunions</h1>
      <p>Points de suivi planifiés avec vos stagiaires.</p>
    </div>
    <button type="button" class="btn btn-login btn-pill" data-bs-toggle="modal" data-bs-target="#modalReunion">
      <i class="fas fa-calendar-plus me-1"></i> Planifier une réunion
    </button>
  </div>

  <div class="panel-list panel-list-dropdowns">
    <div class="journal-entry" th:each="r : ${reunions}">
      <div class="journal-icon"><i class="fas fa-calendar-check"></i></div>
      <div class="flex-grow-1">
        <div class="journal-desc">
          <strong th:text="${r.stagiaire.nomComplet}">Nom</strong>
          &middot; <span th:text="${#temporals.format(r.dateHeure, 'dd/MM/yyyy à HH:mm')}">01/01/2026</span>
          <span th:if="${r.lieu}"> &middot; <span th:text="${r.lieu}">Lieu</span></span>
        </div>
        <div class="journal-meta" th:text="${r.notes}">Notes</div>
      </div>
      <span class="badge me-2" th:classappend="${r.statut.name() == 'PLANIFIEE'} ? 'bg-warning text-dark' : (${r.statut.name() == 'TERMINEE'} ? 'bg-success' : 'bg-secondary')" th:text="${r.statut}">STATUT</span>
      <div class="dropdown" th:if="${r.statut.name() == 'PLANIFIEE'}">
        <button class="btn btn-sm btn-outline-secondary btn-pill" data-bs-toggle="dropdown">•••</button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li>
            <form th:action="@{'/responsable/reunions/' + ${r.id} + '/statut'}" method="post">
              <input type="hidden" name="statut" value="TERMINEE">
              <button type="submit" class="dropdown-item">Marquer terminée</button>
            </form>
          </li>
          <li>
            <form th:action="@{'/responsable/reunions/' + ${r.id} + '/statut'}" method="post">
              <input type="hidden" name="statut" value="ANNULEE">
              <button type="submit" class="dropdown-item text-danger">Annuler</button>
            </form>
          </li>
        </ul>
      </div>
    </div>

    <div class="text-muted text-center py-5" th:if="${#lists.isEmpty(reunions)}">
      <i class="fas fa-calendar fa-2x mb-2"></i>
      <p>Aucune réunion planifiée.</p>
    </div>
  </div>
</div>

<!-- Modal: planifier une réunion -->
<div class="modal fade" id="modalReunion" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form th:action="@{/responsable/reunions}" method="post">
        <div class="modal-header">
          <h5 class="modal-title">Planifier une réunion</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Stagiaire</label>
            <select name="stagiaireId" class="form-select" required>
              <option th:each="s : ${stagiaires}" th:value="${s.id}" th:text="${s.nomComplet}"></option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Date et heure</label>
            <input type="datetime-local" name="dateHeure" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Lieu / mode</label>
            <input type="text" name="lieu" class="form-control" placeholder="ex. Bureau 302, Visio...">
          </div>
          <div class="mb-3">
            <label class="form-label">Notes</label>
            <textarea name="notes" class="form-control" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="submit" class="btn btn-login">Planifier</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
